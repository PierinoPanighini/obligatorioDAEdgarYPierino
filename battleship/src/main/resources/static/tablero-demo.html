<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo del tablero</title>
  <link rel="stylesheet" href="/tablero-demo.css">
</head>

<body>
  <main class="demo">
    <h1><label id="mensaje" aria-live="polite">Tablero demo</label></h1>
    <div class="acciones" aria-label="Acciones del tablero">
      <button type="button" data-endpoint="/accion1">Acción 1</button>
      <button type="button" data-endpoint="/accion2">Acción 2</button>
      <button type="button" data-endpoint="/accion3">Acción 3</button>
      <button type="button" data-endpoint="/accion4">Acción 4</button>
    </div>
  </main>

  <div id="tablero"></div>

  <script type="module">
    import dispatcher from "./CommandDispatcher.js";
    import BattleShipBoard from "./BattleShipBoard.js";

    const mensaje = document.getElementById("mensaje");
    const view = dispatcher.registerView("tablero-demo", {
      urlInicio: "/inicializarDemo"
    });

    const board = new BattleShipBoard(
      document.getElementById("tablero"),
      CommandDispatcher,
      { anchoMaximo: 1000, altoMaximo: 1000, tamanoFuente: 12, tamanoIcono: 28 }
    );

    view.handler("mostrarMensaje", (parametro) => {
      mensaje.textContent = parametro;
    });

    document.querySelectorAll("[data-endpoint]").forEach((boton) => {
      boton.addEventListener("click", () => {
        dispatcher.submit(boton.dataset.endpoint);
      });
    });

    dispatcher.startView(view);
  </script>
</body>

</html>
